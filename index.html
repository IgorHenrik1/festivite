<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Festivite</title>
  </head>
  <body>
    <main>
      <section id="hero">
        <div class="text-hero">
          <img src="assets/Logo.svg" alt="Logo de confetes" />
          <div>
            <h1>Festivite</h1>
            <p>Crie um convite digital para o seu evento</p>
          </div>
        </div>
      </section>
      <section id="invitation-form">
        <div class="container">
          <h2>Crie seu convite</h2>
          <form>
            <div class="title-form">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-calendar-icon lucide-calendar"
              >
                <path d="M8 2v3" />
                <path d="M16 2v3" />
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M3 9h18" />
              </svg>
              <p>Sobre o evento</p>
            </div>

            <div class="form-group">
              <label for="event-name">Título</label>
              <input type="text" id="event-name" placeholder="Nome do evento" />
            </div>

            <div class="form-center">
              <div class="form-group">
                <label for="event-start-date">Início</label>
                <input type="date" id="event-start-date" />
              </div>

              <div class="form-group">
                <label for="event-end-date">Fim</label>
                <input type="date" id="event-end-date" />
              </div>

              <div class="form-group">
                <label>Tipo</label>
                <div class="options">
                  <input
                    type="radio"
                    name="tipo"
                    id="presencial"
                    value="presencial"
                  />
                  <label for="presencial"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-building2-icon lucide-building-2"
                    >
                      <path d="M10 12h4" />
                      <path d="M10 8h4" />
                      <path d="M14 21v-3a2 2 0 0 0-4 0v3" />
                      <path
                        d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"
                      />
                      <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />
                    </svg>
                    <span>Presencial</span></label
                  >

                  <input type="radio" name="tipo" id="online" value="online" />
                  <label for="online">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-video-icon lucide-video"
                    >
                      <path
                        d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"
                      />
                      <rect x="2" y="6" width="14" height="12" rx="2" />
                    </svg>
                    <span>Online</span></label
                  >
                </div>
              </div>

              <div class="form-group">
                <label for="event-location">Local</label>
                <input
                  type="text"
                  id="event-location"
                  placeholder="Link ou endereço"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="event-description">Descrição</label>
              <textarea
                style="height: 136px; max-height: 136px"
                id="event-description"
                name="event-description"
                placeholder="Escreva sobre os detalhes do evento"
              ></textarea>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
