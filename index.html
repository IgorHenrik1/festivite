<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Festivite</title>
  </head>
  <body>
    <main>
      <section id="hero">
        <div class="text-hero">
          <img src="assets/Logo.svg" alt="Logo de confetes" />
          <div>
            <h1>Festivite</h1>
            <p>Crie um convite digital para o seu evento</p>
          </div>
        </div>
      </section>
      <section id="invitation-form">
        <div class="container">
          <h2>Crie seu convite</h2>
          <form>
            <div class="title-form">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-calendar-icon lucide-calendar"
              >
                <path d="M8 2v3" />
                <path d="M16 2v3" />
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M3 9h18" />
              </svg>
              <p>Sobre o evento</p>
            </div>

            <div class="form-group">
              <label for="event-name">Título</label>
              <input type="text" id="event-name" placeholder="Nome do evento" />
            </div>

            <div class="form-center">
              <div class="form-group">
                <label for="event-start-date">Início</label>
                <input type="date" id="event-start-date" />
              </div>

              <div class="form-group">
                <label for="event-end-date">Fim</label>
                <input type="date" id="event-end-date" />
              </div>

              <div class="form-group">
                <label>Tipo</label>
                <div class="options">
                  <input
                    type="radio"
                    name="tipo"
                    id="presencial"
                    value="presencial"
                  />
                  <label for="presencial"
                    ><svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-building2-icon lucide-building-2"
                    >
                      <path d="M10 12h4" />
                      <path d="M10 8h4" />
                      <path d="M14 21v-3a2 2 0 0 0-4 0v3" />
                      <path
                        d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"
                      />
                      <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />
                    </svg>
                    <span>Presencial</span></label
                  >

                  <input type="radio" name="tipo" id="online" value="online" />
                  <label for="online">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="lucide lucide-video-icon lucide-video"
                    >
                      <path
                        d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"
                      />
                      <rect x="2" y="6" width="14" height="12" rx="2" />
                    </svg>
                    <span>Online</span></label
                  >
                </div>
              </div>

              <div class="form-group">
                <label for="event-location">Local</label>
                <input
                  type="text"
                  id="event-location"
                  placeholder="Link ou endereço"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="event-description">Descrição</label>
              <textarea
                style="height: 136px; max-height: 136px"
                id="event-description"
                name="event-description"
                placeholder="Escreva sobre os detalhes do evento"
              ></textarea>
            </div>

            <div class="title-form">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-paintbrush-vertical-icon lucide-paintbrush-vertical"
              >
                <path d="M10 2v2" />
                <path d="M14 2v4" />
                <path d="M17 2a1 1 0 0 1 1 1v9H6V3a1 1 0 0 1 1-1z" />
                <path
                  d="M6 12a1 1 0 0 0-1 1v1a2 2 0 0 0 2 2h2a1 1 0 0 1 1 1v2.9a2 2 0 1 0 4 0V17a1 1 0 0 1 1-1h2a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1"
                />
              </svg>
              <p>Personalização</p>
            </div>

            <div class="form-group">
              <label style="color: #fff">Cor principal</label>
              <div class="colors">
                <input
                  type="radio"
                  name="color"
                  id="purple"
                  value="purple"
                  checked
                />
                <label for="purple" class="color-purple"></label>

                <input type="radio" name="color" id="fuchsia" value="fuchsia" />
                <label for="fuchsia" class="color-fuchsia"></label>

                <input type="radio" name="color" id="pink" value="pink" />
                <label for="pink" class="color-pink"></label>

                <input type="radio" name="color" id="orange" value="orange" />
                <label for="orange" class="color-orange"></label>

                <input type="radio" name="color" id="yellow" value="yellow" />
                <label for="yellow" class="color-yellow"></label>

                <input type="radio" name="color" id="lime" value="lime" />
                <label for="lime" class="color-lime"></label>

                <input type="radio" name="color" id="green" value="green" />
                <label for="green" class="color-green"></label>

                <input type="radio" name="color" id="cyan" value="cyan" />
                <label for="cyan" class="color-cyan"></label>

                <input type="radio" name="color" id="navy" value="navy" />
                <label for="navy" class="color-navy"></label>
              </div>
            </div>
            <div class="form-group">
              <label style="color: #fff">Tema do evento</label>
              <div class="event-types">
                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="birthday"
                    value="birthday"
                    checked
                  />

                  <label for="birthday">
                    <img src="assets/aniversario.jpg" alt="Aniversário" />
                    <span>Aniversário</span>
                  </label>
                </div>

                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="child"
                    value="child"
                  />

                  <label for="child">
                    <img src="assets/infantil.jpg" alt="Infantil" />
                    <span>Infantil</span>
                  </label>
                </div>

                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="graduation"
                    value="graduation"
                  />

                  <label for="graduation">
                    <img src="assets/formatura.jpg" alt="Formatura" />
                    <span>Formatura</span>
                  </label>
                </div>

                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="wedding"
                    value="wedding"
                  />

                  <label for="wedding">
                    <img src="assets/casamento.jpg" alt="Casamento" />
                    <span>Casamento</span>
                  </label>
                </div>
                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="baby-shower"
                    value="baby-shower"
                  />

                  <label for="baby-shower">
                    <img
                      src="assets/cha-de-bebe.jpg"
                      alt="Imagem referente a chá de bebê"
                    />
                    <span>Chá de bebê</span>
                  </label>
                </div>
                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="bridal-shower"
                    value="bridal-shower"
                  />

                  <label for="bridal-shower">
                    <img
                      src="assets/cha-de-panela.jpg"
                      alt="Imagem referente a chá de panela"
                    />
                    <span>Chá de panela</span>
                  </label>
                </div>
                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="carnaval"
                    value="carnaval"
                  />

                  <label for="carnaval">
                    <img
                      src="assets/carnaval.jpg"
                      alt="Imagem referente a carnaval"
                    />
                    <span>Carnaval</span>
                  </label>
                </div>
                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="easter"
                    value="easter"
                  />

                  <label for="easter">
                    <img
                      src="assets/pascoa.jpg"
                      alt="Imagem referente a páscoa"
                    />
                    <span>Páscoa</span>
                  </label>
                </div>
                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="june-celebration"
                    value="june-celebration"
                  />

                  <label for="june-celebration">
                    <img
                      src="assets/sao-joao.jpg"
                      alt="Imagem referente a São João"
                    />
                    <span>São João</span>
                  </label>
                </div>
                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="halloween"
                    value="halloween"
                  />

                  <label for="halloween">
                    <img
                      src="assets/halloween.jpg"
                      alt="Imagem referente a Halloween"
                    />
                    <span>Halloween</span>
                  </label>
                </div>
                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="christmas"
                    value="christmas"
                  />

                  <label for="christmas">
                    <img
                      src="assets/natal.jpg"
                      alt="Imagem referente a Natal"
                    />
                    <span>Natal</span>
                  </label>
                </div>
                <div class="event-type">
                  <input
                    type="radio"
                    name="event-type"
                    id="others"
                    value="others"
                  />

                  <label for="others">
                    <img src="assets/outros.jpg" alt="Outros" />
                    <span>Outros</span>
                  </label>
                </div>
              </div>
            </div>
            <div class="form-group style-cover">
              <!-- Estilo -->
              <div class="styles">
                <label style="color: #fff">Estilo</label>

                <div class="theme-switch">
                  <label class="switch">
                    <input type="checkbox" />
                    <span class="slider"></span>
                  </label>

                  <p>Escuro</p>
                </div>
              </div>

              <!-- Foto de capa -->
              <div class="cover-photo">
                <label style="color: #fff">Foto de capa</label>

                <div class="file-upload">
                  <input type="file" id="cover" name="cover" accept="image/*" />

                  <label for="cover" class="file-button">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 3v12" />
                      <path d="m7 8 5-5 5 5" />
                      <path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" />
                    </svg>

                    Selecionar
                  </label>

                  <span class="file-name">Nenhum arquivo selecionado</span>
                </div>
              </div>
            </div>

            <div class="title-form">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-contact-icon lucide-contact"
              >
                <path d="M16 2v2" />
                <path d="M7 21v-2a2 2 0 012-2h6a2 2 0 012 2v2" />
                <path d="M8 2v2" />
                <circle cx="12" cy="10" r="3" />
                <rect x="3" y="3" width="18" height="18" rx="2" />
              </svg>
              <p>Dados para contato</p>
            </div>

            <div class="form-group">
              <label for="event-fullname">Nome</label>
              <input
                type="text"
                id="event-fullname"
                placeholder="Nome completo"
                required
              />
            </div>
            <div class="form-center">
              <div class="form-group">
                <label for="event-email">E-mail</label>
                <input
                  type="email"
                  id="event-email"
                  placeholder="exemplo@email.com"
                />
              </div>

              <div class="form-group">
                <label for="event-phone">Telefone</label>
                <input
                  type="tel"
                  id="event-phone"
                  placeholder="(99) 99999-9999 "
                />
              </div>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
